name: Playwright QA smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ vars.QA_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      QA_BASE_URL: ${{ vars.QA_BASE_URL }}
      QA_API_URL: ${{ vars.QA_API_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run anonymous smoke checks
        run: npm run test:smoke
      - name: Upload failure evidence / HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
